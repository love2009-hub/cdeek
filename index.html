<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-магазин одежды</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #f5f5f7; color: #1d1d1f; line-height: 1.5; }
  header { background: #fff; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
           position: sticky; top: 0; z-index: 100; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; }
  .cart-btn { float: right; background: #0071e3; color: #fff; border: none;
              padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
  .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
              gap: 20px; margin-top: 20px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden;
          box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: transform .2s; }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; height: 280px; object-fit: cover; background: #eee; }
  .card-body { padding: 16px; }
  .card h3 { font-size: 17px; margin-bottom: 6px; }
  .price { font-size: 20px; font-weight: 600; color: #0071e3; margin: 8px 0; }
  .sizes { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .size { padding: 6px 10px; border: 1px solid #d2d2d7; border-radius: 6px;
          cursor: pointer; font-size: 13px; background: #fff; }
  .size.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
  .btn { background: #0071e3; color: #fff; border: none; padding: 10px 18px;
         border-radius: 8px; cursor: pointer; font-size: 14px; width: 100%; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: #0071e3; border: 1px solid #0071e3; }

  /* Модалка корзины */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
           z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: #fff; border-radius: 12px; max-width: 600px; width: 100%;
                   max-height: 90vh; overflow-y: auto; padding: 24px; }
  .close { float: right; background: none; border: none; font-size: 24px; cursor: pointer; }
  .cart-item { display: flex; justify-content: space-between; padding: 10px 0;
               border-bottom: 1px solid #eee; }
  .total { font-size: 20px; font-weight: 600; margin: 16px 0; }

  /* Форма заказа */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
  .form-group input { width: 100%; padding: 10px; border: 1px solid #d2d2d7;
                      border-radius: 8px; font-size: 14px; }
  .autocomplete { position: relative; }
  .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff;
                       border: 1px solid #d2d2d7; border-radius: 0 0 8px 8px; max-height: 240px;
                       overflow-y: auto; z-index: 10; display: none; }
  .autocomplete-list.active { display: block; }
  .autocomplete-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .autocomplete-item:hover { background: #f5f5f7; }
  .pvz-list { max-height: 300px; overflow-y: auto; border: 1px solid #d2d2d7;
              border-radius: 8px; margin-top: 10px; }
  .pvz-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
  .pvz-item:hover, .pvz-item.active { background: #e7f1ff; }
  .pvz-item small { color: #666; display: block; margin-top: 4px; }
  #map { width: 100%; height: 360px; border-radius: 8px; margin-top: 10px; }
  .delivery-info { background: #f5f5f7; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .error { color: #d00; font-size: 13px; margin-top: 6px; }
  .loader { text-align: center; padding: 20px; color: #888; }
  .step { display: none; }
  .step.active { display: block; }
  .steps-nav { display: flex; gap: 8px; margin-bottom: 16px; }
  .steps-nav button { flex: 1; padding: 8px; border: 1px solid #d2d2d7; background: #fff;
                      border-radius: 8px; cursor: pointer; font-size: 13px; }
  .steps-nav button.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
</style>
</head>
<body>

<header>
  <div class="container" style="padding: 0;">
    <h1>Мини-магазин</h1>
    <button class="cart-btn" onclick="openCart()">Корзина (<span id="cart-count">0</span>)</button>
  </div>
</header>

<div class="container">
  <div class="products" id="products"></div>
</div>

<!-- Модалка корзины и оформления -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">×</button>

    <div class="steps-nav">
      <button id="step-btn-1" class="active" onclick="showStep(1)">1. Корзина</button>
      <button id="step-btn-2" onclick="showStep(2)">2. Доставка</button>
      <button id="step-btn-3" onclick="showStep(3)">3. Оплата</button>
    </div>

    <!-- ШАГ 1: Корзина -->
    <div class="step active" id="step-1">
      <h2>Ваша корзина</h2>
      <div id="cart-items"></div>
      <div class="total">Итого: <span id="subtotal">0</span> ₽</div>
      <button class="btn" onclick="showStep(2)">Оформить заказ</button>
    </div>

    <!-- ШАГ 2: Доставка -->
    <div class="step" id="step-2">
      <h2>Доставка СДЭК</h2>
      <div class="form-group autocomplete">
        <label>Город получения</label>
        <input type="text" id="city-input" placeholder="Начните вводить город..." autocomplete="off">
        <div class="autocomplete-list" id="city-list"></div>
      </div>

      <div id="pvz-section" style="display:none;">
        <div class="form-group">
          <label>Пункт выдачи</label>
          <div id="map"></div>
          <div class="pvz-list" id="pvz-list"></div>
        </div>
        <div id="selected-pvz" class="delivery-info" style="display:none;"></div>
        <div id="delivery-calc" class="delivery-info" style="display:none;"></div>
      </div>

      <div class="error" id="delivery-error"></div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn secondary" onclick="showStep(1)">Назад</button>
        <button class="btn" id="to-payment-btn" onclick="showStep(3)" disabled>Далее</button>
      </div>
    </div>

    <!-- ШАГ 3: Оплата -->
    <div class="step" id="step-3">
      <h2>Контакты и оплата</h2>
      <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="fio" placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" id="phone" placeholder="+7 999 123-45-67">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>

      <div class="delivery-info">
        <div>Товары: <span id="sum-goods">0</span> ₽</div>
        <div>Доставка: <span id="sum-delivery">0</span> ₽</div>
        <div class="total">К оплате: <span id="sum-total">0</span> ₽</div>
      </div>

      <div class="error" id="payment-error"></div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn secondary" onclick="showStep(2)">Назад</button>
        <button class="btn" id="pay-btn" onclick="pay()">Оплатить</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ
// ============================================================
// Замените на URL вашего Cloudflare Worker
const WORKER_URL = 'https://cdek11.aroslavrazzivin.workers.dev/';

// Товары (3 позиции одежды)
const PRODUCTS = [
  { id: 1, name: 'Хлопковая футболка', price: 1990,
    image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400',
    sizes: ['S','M','L','XL'], weight: 200, dims: [30,25,3] },
  { id: 2, name: 'Джинсы классические', price: 4590,
    image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=400',
    sizes: ['28','30','32','34'], weight: 600, dims: [35,30,5] },
  { id: 3, name: 'Худи оверсайз', price: 3790,
    image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400',
    sizes: ['S','M','L','XL'], weight: 500, dims: [40,35,5] },
];

// Код города ОТПРАВИТЕЛЯ (Москва, основной склад СДЭК)
const FROM_CITY_CODE = 44; // Москва

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  cart: [],
  selectedCity: null,
  pvzList: [],
  selectedPvz: null,
  deliveryPrice: 0,
  yandexMap: null,
  placemarks: [],
};

// ============================================================
// КАТАЛОГ
// ============================================================
function renderProducts() {
  const el = document.getElementById('products');
  el.innerHTML = PRODUCTS.map(p => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}" loading="lazy">
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="price">${p.price} ₽</div>
        <div class="sizes" data-id="${p.id}">
          ${p.sizes.map(s => `<div class="size" onclick="selectSize(${p.id},'${s}',this)">${s}</div>`).join('')}
        </div>
        <button class="btn" onclick="addToCart(${p.id})">В корзину</button>
      </div>
    </div>
  `).join('');
}

function selectSize(pid, size, el) {
  el.parentElement.querySelectorAll('.size').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const p = PRODUCTS.find(x => x.id === pid);
  p._selectedSize = size;
}

function addToCart(pid) {
  const p = PRODUCTS.find(x => x.id === pid);
  if (!p._selectedSize) { alert('Выберите размер'); return; }
  state.cart.push({ ...p, size: p._selectedSize, qty: 1 });
  updateCart();
  openCart();
}

function updateCart() {
  document.getElementById('cart-count').textContent = state.cart.length;
  const items = document.getElementById('cart-items');
  if (!state.cart.length) {
    items.innerHTML = '<p>Корзина пуста</p>';
    document.getElementById('subtotal').textContent = 0;
    return;
  }
  items.innerHTML = state.cart.map((it, i) => `
    <div class="cart-item">
      <div>${it.name} <small>(${it.size})</small><br><small>${it.price} ₽ × ${it.qty}</small></div>
      <button class="btn secondary" style="width:auto;padding:4px 10px;" onclick="removeFromCart(${i})">×</button>
    </div>
  `).join('');
  const total = state.cart.reduce((s, it) => s + it.price * it.qty, 0);
  document.getElementById('subtotal').textContent = total;
}

function removeFromCart(i) {
  state.cart.splice(i, 1);
  updateCart();
}

// ============================================================
// МОДАЛКА И ШАГИ
// ============================================================
function openCart() {
  document.getElementById('modal').classList.add('active');
  showStep(1);
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}
function showStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById('step-' + i).classList.toggle('active', i === n);
    document.getElementById('step-btn-' + i).classList.toggle('active', i === n);
  });
  if (n === 2) initYandexMap();
  if (n === 3) updateTotals();
}

function updateTotals() {
  const goods = state.cart.reduce((s, it) => s + it.price * it.qty, 0);
  document.getElementById('sum-goods').textContent = goods;
  document.getElementById('sum-delivery').textContent = state.deliveryPrice;
  document.getElementById('sum-total').textContent = goods + state.deliveryPrice;
}

// ============================================================
// ПОИСК ГОРОДОВ СДЭК
// ============================================================
let cityTimer;
document.getElementById('city-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(cityTimer);
  if (q.length < 2) { document.getElementById('city-list').classList.remove('active'); return; }
  cityTimer = setTimeout(() => searchCities(q), 300);
});

async function searchCities(q) {
  try {
    const res = await fetch(`${WORKER_URL}/api/cdek/cities?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const list = document.getElementById('city-list');
    if (!Array.isArray(data) || !data.length) {
      list.innerHTML = '<div class="autocomplete-item">Ничего не найдено</div>';
      list.classList.add('active');
      return;
    }
    list.innerHTML = data.map(c => `
      <div class="autocomplete-item" onclick="selectCity(${c.code}, '${c.city_name.replace(/'/g,"\\'")}', ${c.region || 'null'})">
        ${c.city_name}${c.region ? ', ' + c.region : ''}
      </div>
    `).join('');
    list.classList.add('active');
  } catch (e) {
    document.getElementById('delivery-error').textContent = 'Ошибка поиска городов';
  }
}

async function selectCity(code, name) {
  state.selectedCity = { code, name };
  document.getElementById('city-input').value = name;
  document.getElementById('city-list').classList.remove('active');
  document.getElementById('pvz-section').style.display = 'block';
  await loadPvz(code);
}

// ============================================================
// ЗАГРУЗКА ПВЗ И КАРТА
// ============================================================
async function loadPvz(cityCode) {
  const list = document.getElementById('pvz-list');
  list.innerHTML = '<div class="loader">Загрузка пунктов...</div>';
  try {
    const res = await fetch(`${WORKER_URL}/api/cdek/pvz?city_code=${cityCode}`);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) {
      list.innerHTML = '<div class="pvz-item">ПВЗ не найдены</div>';
      state.pvzList = [];
      return;
    }
    state.pvzList = data;
    renderPvzList();
    renderPvzOnMap();
    await calcDelivery(cityCode);
  } catch (e) {
    list.innerHTML = '<div class="pvz-item error">Ошибка загрузки ПВЗ</div>';
  }
}

function renderPvzList() {
  const list = document.getElementById('pvz-list');
  list.innerHTML = state.pvzList.map((p, i) => `
    <div class="pvz-item" data-idx="${i}" onclick="selectPvz(${i})">
      <b>${p.name || 'ПВЗ'}</b><br>
      ${p.location.address}
      <small>Режим работы: ${p.work_time || '—'}</small>
    </div>
  `).join('');
}

function selectPvz(idx) {
  const pvz = state.pvzList[idx];
  state.selectedPvz = pvz;
  document.querySelectorAll('.pvz-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.pvz-item[data-idx="${idx}"]`).classList.add('active');
  document.getElementById('selected-pvz').style.display = 'block';
  document.getElementById('selected-pvz').innerHTML = `
    <b>Выбрано:</b> ${pvz.location.address}<br>
    <small>Код: ${pvz.code} • Режим: ${pvz.work_time || '—'}</small>
  `;
  document.getElementById('to-payment-btn').disabled = false;
  if (state.yandexMap && pvz.location.latitude) {
    state.yandexMap.setCenter([pvz.location.latitude, pvz.location.longitude], 16);
  }
}

// ============================================================
// ЯНДЕКС.КАРТЫ
// ============================================================
let ymapsReady = false;
async function initYandexMap() {
  if (ymapsReady) return;
  try {
    const res = await fetch(`${WORKER_URL}/api/yandex-key`);
    const { key } = await res.json();
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://api-maps.yandex.ru/2.1/?apikey=${key}&lang=ru_RU`;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    await new Promise(r => ymaps.ready(r));
    state.yandexMap = new ymaps.Map('map', { center: [55.75, 37.62], zoom: 10, controls: ['zoomControl'] });
    ymapsReady = true;
  } catch (e) {
    document.getElementById('map').innerHTML = '<div class="error">Карта недоступна</div>';
  }
}

function renderPvzOnMap() {
  if (!state.yandexMap || !state.pvzList.length) return;
  // Удаляем старые
  state.placemarks.forEach(pm => state.yandexMap.geoObjects.remove(pm));
  state.placemarks = [];

  const coords = state.pvzList
    .filter(p => p.location.latitude && p.location.longitude)
    .map(p => [p.location.latitude, p.location.longitude]);

  if (!coords.length) return;

  // Центрируем по среднему
  const avgLat = coords.reduce((s, c) => s + c[0], 0) / coords.length;
  const avgLon = coords.reduce((s, c) => s + c[1], 0) / coords.length;
  state.yandexMap.setCenter([avgLat, avgLon], 11);

  // Добавляем маркеры с кластеризацией
  const clusterer = new ymaps.Clusterer({ preset: 'islands#blueCircleClusterIcons' });
  state.pvzList.forEach((p, i) => {
    if (!p.location.latitude) return;
    const pm = new ymaps.Placemark({
      geometry: { coordinates: [p.location.latitude, p.location.longitude] },
      properties: { balloonContent: `<b>${p.name || 'ПВЗ'}</b><br>${p.location.address}` },
    }, { preset: 'islands#blueCircleDotIcon' });
    pm.events.add('click', () => selectPvz(i));
    state.placemarks.push(pm);
  });
  state.yandexMap.geoObjects.add(clusterer.add(state.placemarks));
}

// ============================================================
// РАСЧЁТ ДОСТАВКИ
// ============================================================
async function calcDelivery(toCityCode) {
  const calc = document.getElementById('delivery-calc');
  calc.style.display = 'block';
  calc.innerHTML = '<div class="loader">Расчёт стоимости...</div>';
  try {
    // Собираем посылки (каждый товар — отдельное место)
    const packages = state.cart.map(it => ({
      weight: it.weight,
      length: it.dims[0],
      width: it.dims[1],
      height: it.dims[2],
    }));
    const body = {
      type: 2, // ПВЗ-ПВЗ
      currency: 1, // RUB
      lang: 'rus',
      from: { city_code: FROM_CITY_CODE },
      to: { city_code: toCityCode },
      packages,
    };
    const res = await fetch(`${WORKER_URL}/api/cdek/calc`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.tariff_codes) {
      // Берём самый дешёвый тариф
      const tariffs = data.tariff_codes.map((code, i) => ({
        code,
        name: data.tariffs[i]?.tariff_name || 'Тариф',
        price: data.delivery_sum[i],
        period: data.period[i],
      }));
      tariffs.sort((a, b) => a.price - b.price);
      const best = tariffs[0];
      state.deliveryPrice = best.price;
      calc.innerHTML = `
        <b>${best.name}</b><br>
        Стоимость: ${best.price} ₽<br>
        Срок: ${best.period.min}–${best.period.max} дн.
      `;
      updateTotals();
    } else {
      calc.innerHTML = '<div class="error">Не удалось рассчитать: ' + (data.message || 'неизвестно') + '</div>';
    }
  } catch (e) {
    calc.innerHTML = '<div class="error">Ошибка расчёта</div>';
  }
}

// ============================================================
// ОПЛАТА ЮKassa
// ============================================================
async function pay() {
  const err = document.getElementById('payment-error');
  err.textContent = '';
  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.textContent = 'Создаём платёж...';

  const fio = document.getElementById('fio').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!fio || !phone || !email) { err.textContent = 'Заполните все поля'; btn.disabled = false; btn.textContent = 'Оплатить'; return; }
  if (!state.selectedPvz) { err.textContent = 'Выберите пункт выдачи'; btn.disabled = false; btn.textContent = 'Оплатить'; return; }

  const total = state.cart.reduce((s, it) => s + it.price * it.qty, 0) + state.deliveryPrice;

  try {
    // 1. Создаём платёж
    const payRes = await fetch(`${WORKER_URL}/api/payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: total.toFixed(2),
        description: 'Заказ в мини-магазине',
        return_url: location.href,
        metadata: {
          cart: state.cart.map(it => ({ id: it.id, name: it.name, size: it.size, qty: it.qty })),
          pvz_code: state.selectedPvz.code,
          fio, phone, email,
        },
      }),
    });
    const payData = await payRes.json();
    if (!payData.confirmation || !payData.confirmation.confirmation_url) {
      throw new Error(payData.description || 'Не удалось создать платёж');
    }

    // 2. Создаём заказ в СДЭК (после успешной оплаты — в реальности через webhook,
    //    но для простоты — сразу. Если оплата не пройдёт, заказ можно отменить.)
    try {
      const orderRes = await fetch(`${WORKER_URL}/api/cdek/order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 2,
          number: 'ORD-' + Date.now(),
          tariff_code: 139, // ПВЗ-ПВЗ, базовый тариф
          delivery_point: state.selectedPvz.code,
          packages: state.cart.map(it => ({
            weight: it.weight,
            length: it.dims[0], width: it.dims[1], height: it.dims[2],
            items: [{ name: it.name, ware_key: 'ITEM-' + it.id, cost: it.price, amount: it.qty, weight: it.weight }]
          })),
          recipient: {
            name: fio.split(' ')[0] || 'Иван',
            last_name: fio.split(' ')[1] || 'Иванов',
            phone,
            email,
          },
          comment: 'Заказ через мини-магазин',
        }),
      });
      const orderData = await orderRes.json();
      console.log('CDEK order:', orderData);
    } catch (e) {
      console.warn('CDEK order creation failed (non-fatal):', e);
    }

    // 3. Редирект на оплату
    location.href = payData.confirmation.confirmation_url;
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Оплатить';
  }
}
