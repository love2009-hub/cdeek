<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оформление заказа</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: #fff;
    color: #111;
    line-height: 1.5;
    font-size: 15px;
  }
  /* Хедер */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
  }
  .logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    font-style: italic;
  }
  .header-icons { display: flex; gap: 18px; font-size: 22px; }
  .header-icons span { cursor: pointer; }

  /* Основной контейнер */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  /* Секции */
  .section {
    margin-bottom: 36px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 12px;
    border-bottom: 1px solid #ddd;
    margin-bottom: 20px;
  }

  /* Поля формы */
  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field label .req { color: #111; }
  .field label .opt {
    color: #888;
    font-weight: 400;
    text-transform: none;
    font-size: 12px;
    letter-spacing: 0;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ccc;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    background: #fff;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: #111;
  }
  .field textarea {
    min-height: 80px;
    resize: vertical;
  }
  .field .input-wrap {
    position: relative;
  }
  .field .input-wrap .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 20px;
    color: #999;
    cursor: pointer;
    display: none;
  }
  .field .input-wrap .clear-btn.show { display: block; }

  /* Автокомплит */
  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #ccc;
    border-top: none;
    max-height: 240px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .autocomplete-list.active { display: block; }
  .autocomplete-item {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .autocomplete-item:hover { background: #f5f5f5; }

  /* Способ доставки (2 кнопки) */
  .delivery-mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .delivery-mode button {
    padding: 16px 12px;
    border: 2px solid #111;
    background: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 1px;
    line-height: 1.3;
  }
  .delivery-mode button.active {
    background: #f5f5f5;
  }

  /* Варианты доставки (карточки) */
  .tariff-card {
    border: 2px solid #ddd;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    position: relative;
    transition: border-color .2s;
  }
  .tariff-card:hover { border-color: #999; }
  .tariff-card.active { border-color: #111; }
  .tariff-card input[type="radio"] {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 20px;
    height: 20px;
    accent-color: #111;
  }
  .tariff-card .tc-content {
    margin-left: 36px;
  }
  .tariff-card .tc-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .tariff-card .tc-desc {
    font-size: 13px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .tariff-card .tc-price {
    font-size: 22px;
    font-weight: 700;
    text-align: right;
    margin-top: 8px;
  }

  /* Карта */
  #map {
    width: 100%;
    height: 380px;
    border: 1px solid #ddd;
    margin-bottom: 16px;
  }
  .map-hint {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  /* Корзина / заказ */
  .order-item {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #eee;
    align-items: center;
  }
  .order-item img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    background: #f5f5f5;
    flex-shrink: 0;
  }
  .order-item-info { flex: 1; }
  .order-item-name {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .order-item-meta {
    font-size: 13px;
    color: #555;
  }
  .order-item-meta .size-badge {
    display: inline-block;
    background: #f0f0f0;
    padding: 2px 8px;
    font-weight: 700;
    margin-right: 8px;
  }
  .order-item-price {
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* Итого */
  .totals {
    margin-top: 20px;
    padding-top: 16px;
  }
  .totals-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 15px;
  }
  .totals-row.total {
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-top: 16px;
    border-top: 1px solid #ddd;
    margin-top: 8px;
  }

  /* Чекбокс оферты */
  .offer-check {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin: 24px 0;
    font-size: 14px;
  }
  .offer-check input {
    width: 22px;
    height: 22px;
    accent-color: #111;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .offer-check a {
    color: #111;
    text-decoration: underline;
  }

  /* Кнопка оплатить */
  .pay-btn {
    width: 100%;
    padding: 20px;
    background: #bbb;
    color: #fff;
    border: none;
    font-family: 'Courier New', Courier, monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: not-allowed;
    transition: background .2s;
  }
  .pay-btn.ready {
    background: #111;
    cursor: pointer;
  }
  .pay-btn.ready:hover { background: #333; }

  /* Ошибки и загрузчики */
  .error { color: #c00; font-size: 13px; margin-top: 6px; }
  .loader { text-align: center; padding: 20px; color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

  /* Уведомление */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    padding: 12px 24px;
    font-size: 13px;
    z-index: 1000;
    display: none;
    letter-spacing: 1px;
  }
  .toast.show { display: block; }

  @media (max-width: 480px) {
    .page { padding: 16px 14px 80px; }
    .section-title { font-size: 17px; }
    .tariff-card .tc-title { font-size: 14px; }
    .tariff-card .tc-price { font-size: 18px; }
    .order-item img { width: 64px; height: 64px; }
    #map { height: 280px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">VENSKO</div>
  <div class="header-icons">
    <span>🔍</span>
    <span>🛒</span>
    <span>☰</span>
  </div>
</header>

<div class="page">

  <!-- ========== КОНТАКТНЫЕ ДАННЫЕ ========== -->
  <div class="section">
    <div class="section-title">Контактные данные</div>

    <div class="field">
      <label>ФИО <span class="req">*</span></label>
      <input type="text" id="fio" placeholder="Иванов Иван Иванович">
    </div>

    <div class="field">
      <label>Телефон <span class="req">*</span></label>
      <input type="tel" id="phone" placeholder="+7 999 123 45 67">
    </div>

    <div class="field">
      <label>Email <span class="req">*</span></label>
      <input type="email" id="email" placeholder="example@mail.ru">
    </div>

    <div class="field">
      <label>Telegram <span class="opt">(необязательно — для связи)</span></label>
      <input type="text" id="telegram" placeholder="@username или t.me/username">
    </div>
  </div>

  <!-- ========== ДОСТАВКА ========== -->
  <div class="section">
    <div class="section-title">Доставка</div>

    <div class="field">
      <label>Страна <span class="req">*</span></label>
      <select id="country">
        <option value="RU" data-flag="🇷🇺">🇷🇺 Россия</option>
      </select>
    </div>

    <div class="field">
      <label>Город или населённый пункт <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="text" id="city-input" placeholder="Начните вводить город..." autocomplete="off">
        <button class="clear-btn" id="city-clear" onclick="clearCity()">✕</button>
        <div class="autocomplete-list" id="city-list"></div>
      </div>
    </div>

    <div class="field">
      <label>Способ доставки</label>
      <div class="delivery-mode">
        <button id="mode-normal" class="active" onclick="setMode('normal')">Обычная<br>доставка</button>
        <button id="mode-express" onclick="setMode('express')">Экспресс<br>доставка</button>
      </div>
    </div>

    <div id="tariffs-block" style="display:none;">
      <div id="tariffs-list"></div>
    </div>

    <div id="pvz-block" style="display:none;">
      <div class="map-hint">Пункт выдачи (ПВЗ) — выберите на карте</div>
      <div id="map"></div>
      <div class="field">
        <label>Адрес <span class="req">*</span></label>
        <textarea id="pvz-address" placeholder="Город, улица, дом, квартира, индекс" readonly></textarea>
      </div>
    </div>

    <div id="delivery-error" class="error"></div>
  </div>

  <!-- ========== КОММЕНТАРИЙ ========== -->
  <div class="section">
    <div class="section-title">Комментарий к заказу <span class="opt" style="font-size:12px;color:#888;text-transform:none;letter-spacing:0;">(необязательно)</span></div>
    <div class="field">
      <textarea id="comment" placeholder="Пожелания к заказу, какие вещи нашего бренда у вас уже есть (для Secret Box) или пожелания к доставке"></textarea>
    </div>
  </div>

  <!-- ========== ВАШ ЗАКАЗ ========== -->
  <div class="section">
    <div class="section-title">Ваш заказ</div>
    <div id="order-items"></div>

    <div class="totals">
      <div class="totals-row">
        <span>Подитог</span>
        <span id="sum-goods">0 ₽</span>
      </div>
      <div class="totals-row">
        <span>Доставка (СДЭК)</span>
        <span id="sum-delivery">0 ₽</span>
      </div>
      <div class="totals-row total">
        <span>Итого</span>
        <span id="sum-total">0 ₽</span>
      </div>
    </div>
  </div>

  <!-- ========== ОПЛАТА ========== -->
  <div class="offer-check">
    <input type="checkbox" id="offer" onchange="togglePay()">
    <label for="offer">Я согласен с <a href="#">публичной офертой</a> и <a href="#">политикой конфиденциальности</a></label>
  </div>

  <button class="pay-btn" id="pay-btn" onclick="pay()">Оплатить</button>
  <div id="payment-error" class="error" style="margin-top:12px;text-align:center;"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ — ЗАМЕНИТЕ НА СВОЙ URL WORKER
// ============================================================
const WORKER_URL = 'https://YOUR-WORKER.SUBDOMAIN.workers.dev';

// Город отправителя (Москва)
const FROM_CITY_CODE = 44;

// Товары (3 позиции одежды)
const PRODUCTS = [
  { id: 1, name: 'VENSKO HUSTLE POLO (КОРИЧНЕВЫЙ)', price: 3400,
    image: 'https://images.unsplash.com/photo-1586363104862-3a5e2ab60d99?w=200',
    sizes: ['S','M/L','XL'], weight: 200, dims: [30,25,3] },
  { id: 2, name: 'VENSKO CLASSIC TEE (ЧЁРНЫЙ)', price: 2200,
    image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=200',
    sizes: ['S','M','L','XL'], weight: 180, dims: [30,25,3] },
  { id: 3, name: 'VENSKO OVERSIZE HOODIE (СЕРЫЙ)', price: 4500,
    image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=200',
    sizes: ['M','L','XL'], weight: 500, dims: [40,35,5] },
];

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  cart: [],
  selectedCity: null,
  pvzList: [],
  selectedPvz: null,
  deliveryPrice: 0,
  deliveryMode: 'normal', // normal | express
  selectedTariff: null,
  yandexMap: null,
  placemarks: [],
  clusterer: null,
};

// ============================================================
// ДЕМО-КОРЗИНА (добавьте товары через консоль или UI)
// ============================================================
// Для демо добавим 1 товар
function initDemoCart() {
  const p = PRODUCTS[0];
  state.cart.push({ ...p, size: 'M/L', qty: 1 });
  renderOrder();
}

// ============================================================
// РЕНДЕР ЗАКАЗА
// ============================================================
function renderOrder() {
  const el = document.getElementById('order-items');
  if (!state.cart.length) {
    el.innerHTML = '<p style="color:#888;padding:20px 0;">Корзина пуста</p>';
    updateTotals();
    return;
  }
  el.innerHTML = state.cart.map((it, i) => `
    <div class="order-item">
      <img src="${it.image}" alt="${it.name}">
      <div class="order-item-info">
        <div class="order-item-name">${it.name}</div>
        <div class="order-item-meta">
          <span class="size-badge">Размер: ${it.size}</span>
          · ${it.qty} шт.
        </div>
      </div>
      <div class="order-item-price">${(it.price * it.qty).toLocaleString('ru-RU')} ₽</div>
    </div>
  `).join('');
  updateTotals();
}

function updateTotals() {
  const goods = state.cart.reduce((s, it) => s + it.price * it.qty, 0);
  document.getElementById('sum-goods').textContent = goods.toLocaleString('ru-RU') + ' ₽';
  document.getElementById('sum-delivery').textContent = state.deliveryPrice ? state.deliveryPrice.toLocaleString('ru-RU') + ' ₽' : '0 ₽';
  document.getElementById('sum-total').textContent = (goods + state.deliveryPrice).toLocaleString('ru-RU') + ' ₽';
}

// ============================================================
// ПОИСК ГОРОДОВ
// ============================================================
let cityTimer;
document.getElementById('city-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('city-clear').classList.toggle('show', q.length > 0);
  clearTimeout(cityTimer);
  if (q.length < 2) {
    document.getElementById('city-list').classList.remove('active');
    return;
  }
  cityTimer = setTimeout(() => searchCities(q), 300);
});

async function searchCities(q) {
  try {
    const res = await fetch(`${WORKER_URL}/api/cdek/cities?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const list = document.getElementById('city-list');
    if (!Array.isArray(data) || !data.length) {
      list.innerHTML = '<div class="autocomplete-item">Ничего не найдено</div>';
      list.classList.add('active');
      return;
    }
    list.innerHTML = data.map(c => `
      <div class="autocomplete-item" onclick="selectCity(${c.code}, '${(c.city_name||'').replace(/'/g,"\\'")}')">
        ${c.city_name}${c.region ? ', ' + c.region : ''}
      </div>
    `).join('');
    list.classList.add('active');
  } catch (e) {
    toast('Ошибка поиска городов');
  }
}

async function selectCity(code, name) {
  state.selectedCity = { code, name };
  document.getElementById('city-input').value = name;
  document.getElementById('city-list').classList.remove('active');
  document.getElementById('city-clear').classList.add('show');
  document.getElementById('tariffs-block').style.display = 'block';
  await calcTariffs();
}

function clearCity() {
  state.selectedCity = null;
  state.pvzList = [];
  state.selectedPvz = null;
  state.deliveryPrice = 0;
  state.selectedTariff = null;
  document.getElementById('city-input').value = '';
  document.getElementById('city-clear').classList.remove('show');
  document.getElementById('tariffs-block').style.display = 'none';
  document.getElementById('pvz-block').style.display = 'none';
  document.getElementById('tariffs-list').innerHTML = '';
  document.getElementById('pvz-address').value = '';
  if (state.yandexMap) {
    state.yandexMap.geoObjects.removeAll();
    state.yandexMap.setCenter([55.75, 37.62], 10);
  }
  updateTotals();
}

// Закрытие автокомплита по клику вне
document.addEventListener('click', e => {
  if (!e.target.closest('#city-input') && !e.target.closest('#city-list')) {
    document.getElementById('city-list').classList.remove('active');
  }
});

// ============================================================
// СПОСОБ ДОСТАВКИ
// ============================================================
function setMode(mode) {
  state.deliveryMode = mode;
  document.getElementById('mode-normal').classList.toggle('active', mode === 'normal');
  document.getElementById('mode-express').classList.toggle('active', mode === 'express');
  if (state.selectedCity) calcTariffs();
}

// ============================================================
// РАСЧЁТ ТАРИФОВ
// ============================================================
async function calcTariffs() {
  if (!state.selectedCity) return;
  const list = document.getElementById('tariffs-list');
  list.innerHTML = '<div class="loader">Рассчитываем стоимость...</div>';
  document.getElementById('delivery-error').textContent = '';

  try {
    const packages = state.cart.map(it => ({
      weight: it.weight,
      length: it.dims[0],
      width: it.dims[1],
      height: it.dims[2],
    }));

    // type: 1 = склад-дверь, 2 = склад-склад (ПВЗ), 3 = склад-постамат
    const types = [
      { type: 1, title: 'Посылка склад-дверь', desc: 'Доставка до двери' },
      { type: 2, title: 'Посылка склад-склад', desc: 'Доставка до ПВЗ' },
      { type: 3, title: 'Посылка склад-постамат', desc: 'Доставка до ПВЗ' },
    ];

    // Для каждого типа считаем тарифы
    const results = [];
    for (const t of types) {
      const body = {
        type: t.type,
        currency: 1,
        lang: 'rus',
        from: { city_code: FROM_CITY_CODE },
        to: { city_code: state.selectedCity.code },
        packages,
      };
      if (state.deliveryMode === 'express') {
        body.services = [{ code: 'INSURANCE' }]; // можно добавить экспресс-сервис
      }
      const res = await fetch(`${WORKER_URL}/api/cdek/calc`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.tariff_codes && data.tariff_codes.length) {
        // Берём первый (обычно самый дешёвый)
        const tariffCode = data.tariff_codes[0];
        const tariffName = data.tariffs?.[0]?.tariff_name || 'Тариф';
        const price = data.delivery_sum?.[0] || 0;
        const period = data.period?.[0] || { min: 3, max: 5 };
        results.push({ ...t, tariffCode, tariffName, price, period });
      }
    }

    if (!results.length) {
      list.innerHTML = '<div class="error">Не удалось рассчитать доставку. Проверьте город.</div>';
      return;
    }

    list.innerHTML = results.map((r, i) => `
      <div class="tariff-card ${i === 0 ? 'active' : ''}" data-idx="${i}" onclick="selectTariff(${i})">
        <input type="radio" name="tariff" ${i === 0 ? 'checked' : ''}>
        <div class="tc-content">
          <div class="tc-title">${r.title}</div>
          <div class="tc-desc">${r.desc} · ${r.period.min}-${r.period.max} дн.</div>
        </div>
        <div class="tc-price">${r.price} ₽</div>
      </div>
    `).join('');

    // Выбираем первый по умолчанию
    selectTariff(0, results);

  } catch (e) {
    list.innerHTML = '<div class="error">Ошибка расчёта доставки</div>';
  }
}

let currentTariffs = [];
function selectTariff(idx, results) {
  // Если results не передан — берём из currentTariffs
  if (!results) results = currentTariffs;
  if (!results.length) return;
  currentTariffs = results;

  const r = results[idx];
  state.selectedTariff = r;
  state.deliveryPrice = r.price;

  // Подсветка карточки
  document.querySelectorAll('.tariff-card').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.querySelector('input').checked = i === idx;
  });

  // Показываем карту только для склад-склад и склад-постамат
  if (r.type === 2 || r.type === 3) {
    document.getElementById('pvz-block').style.display = 'block';
    initYandexMap();
    loadPvz(state.selectedCity.code);
  } else {
    document.getElementById('pvz-block').style.display = 'none';
    state.selectedPvz = null;
    document.getElementById('pvz-address').value = '';
  }

  updateTotals();
  togglePay();
}

// ============================================================
// ЗАГРУЗКА ПВЗ
// ============================================================
async function loadPvz(cityCode) {
  if (!state.yandexMap) return;
  const mapEl = document.getElementById('map');
  mapEl.innerHTML = '<div class="loader">Загрузка пунктов выдачи...</div>';

  try {
    const res = await fetch(`${WORKER_URL}/api/cdek/pvz?city_code=${cityCode}`);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) {
      mapEl.innerHTML = '<div class="error" style="padding:40px;text-align:center;">ПВЗ не найдены в этом городе</div>';
      state.pvzList = [];
      return;
    }
    state.pvzList = data;
    renderPvzOnMap();
  } catch (e) {
    mapEl.innerHTML = '<div class="error" style="padding:40px;text-align:center;">Ошибка загрузки ПВЗ</div>';
  }
}

// ============================================================
// ЯНДЕКС.КАРТЫ
// ============================================================
let ymapsReady = false;
async function initYandexMap() {
  if (ymapsReady) return;
  try {
    const res = await fetch(`${WORKER_URL}/api/yandex-key`);
    const { key } = await res.json();
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://api-maps.yandex.ru/2.1/?apikey=${key}&lang=ru_RU`;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    await new Promise(r => ymaps.ready(r));
    state.yandexMap = new ymaps.Map('map', {
      center: [55.75, 37.62],
      zoom: 10,
      controls: ['zoomControl', 'fullscreenControl'],
    });
    state.clusterer = new ymaps.Clusterer({
      preset: 'islands#blueCircleClusterIcons',
      groupByCoordinates: false,
    });
    state.yandexMap.geoObjects.add(state.clusterer);
    ymapsReady = true;
  } catch (e) {
    document.getElementById('map').innerHTML = '<div class="error" style="padding:40px;text-align:center;">Карта недоступна</div>';
  }
}

function renderPvzOnMap() {
  if (!state.yandexMap || !state.pvzList.length) return;
  state.clusterer.removeAll();
  state.placemarks = [];

  const coords = state.pvzList
    .filter(p => p.location.latitude && p.location.longitude)
    .map(p => [p.location.latitude, p.location.longitude]);

  if (!coords.length) return;

  const avgLat = coords.reduce((s, c) => s + c[0], 0) / coords.length;
  const avgLon = coords.reduce((s, c) => s + c[1], 0) / coords.length;
  state.yandexMap.setCenter([avgLat, avgLon], 11);

  state.pvzList.forEach((p, i) => {
    if (!p.location.latitude) return;
    const pm = new ymaps.Placemark(
      { coordinates: [p.location.latitude, p.location.longitude] },
      {
        balloonContent: `
          <div style="font-family:monospace;">
            <b>${p.name || 'ПВЗ'}</b><br>
            ${p.location.address}<br>
            <small>Режим: ${p.work_time || '—'}</small><br>
            <small>Тел: ${p.phone || '—'}</small>
          </div>
        `,
        hintContent: p.name || 'ПВЗ',
      },
      { preset: 'islands#blueCircleDotIcon' }
    );
    pm.events.add('click', () => selectPvz(i));
    state.placemarks.push(pm);
  });

  state.clusterer.add(state.placemarks);
}

function selectPvz(idx) {
  const pvz = state.pvzList[idx];
  state.selectedPvz = pvz;
  document.getElementById('pvz-address').value = pvz.location.address;

  // Центрируем карту
  if (state.yandexMap && pvz.location.latitude) {
    state.yandexMap.setCenter([pvz.location.latitude, pvz.location.longitude], 16);
  }

  // Подсветка маркера
  state.placemarks.forEach((pm, i) => {
    pm.options.set('preset', i === idx ? 'islands#blueDotIcon' : 'islands#blueCircleDotIcon');
  });

  togglePay();
  toast('ПВЗ выбран: ' + pvz.location.address);
}

// ============================================================
// ЧЕКБОКС ОПЛАТЫ
// ============================================================
function togglePay() {
  const offer = document.getElementById('offer').checked;
  const hasCity = !!state.selectedCity;
  const hasTariff = !!state.selectedTariff;
  const hasPvz = state.selectedTariff && (state.selectedTariff.type === 1 || !!state.selectedPvz);
  const hasCart = state.cart.length > 0;

  const ready = offer && hasCity && hasTariff && hasPvz && hasCart;
  document.getElementById('pay-btn').classList.toggle('ready', ready);
}

// ============================================================
// ОПЛАТА
// ============================================================
async function pay() {
  const btn = document.getElementById('pay-btn');
  const err = document.getElementById('payment-error');
  err.textContent = '';

  if (!btn.classList.contains('ready')) return;

  const fio = document.getElementById('fio').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const telegram = document.getElementById('telegram').value.trim();
  const comment = document.getElementById('comment').value.trim();

  if (!fio || !phone || !email) {
    err.textContent = 'Заполните ФИО, телефон и email';
    return;
  }

  btn.textContent = 'СОЗДАЁМ ПЛАТЁЖ...';
  btn.disabled = true;

  const total = state.cart.reduce((s, it) => s + it.price * it.qty, 0) + state.deliveryPrice;

  try {
    // 1. Создаём платёж ЮKassa
    const payRes = await fetch(`${WORKER_URL}/api/payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: total.toFixed(2),
        description: 'Заказ VENSKO',
        return_url: location.href,
        metadata: {
          cart: state.cart.map(it => ({ id: it.id, name: it.name, size: it.size, qty: it.qty })),
          fio, phone, email, telegram, comment,
          pvz_code: state.selectedPvz?.code || '',
          pvz_address: state.selectedPvz?.location?.address || '',
          tariff_code: state.selectedTariff?.tariffCode || '',
          delivery_type: state.selectedTariff?.type || '',
        },
      }),
    });
    const payData = await payRes.json();
    if (!payData.confirmation?.confirmation_url) {
      throw new Error(payData.description || 'Не удалось создать платёж');
    }

    // 2. Создаём заказ в СДЭК
    try {
      const orderRes = await fetch(`${WORKER_URL}/api/cdek/order`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: state.selectedTariff.type,
          number: 'VENSKO-' + Date.now(),
          tariff_code: state.selectedTariff.tariffCode,
          ...(state.selectedPvz ? { delivery_point: state.selectedPvz.code } : {}),
          packages: state.cart.map(it => ({
            weight: it.weight,
            length: it.dims[0],
            width: it.dims[1],
            height: it.dims[2],
            items: [{
              name: it.name,
              ware_key: 'ITEM-' + it.id,
              cost: it.price,
              amount: it.qty,
              weight: it.weight,
            }],
          })),
          recipient: {
            name: fio.split(' ')[0] || 'Иван',
            last_name: fio.split(' ')[1] || 'Иванов',
            phone,
            email,
          },
          comment: comment || 'Заказ через сайт VENSKO',
        }),
      });
      const orderData = await orderRes.json();
      console.log('CDEK order:', orderData);
    } catch (e) {
      console.warn('CDEK order failed:', e);
    }

    // 3. Редирект на оплату
    location.href = payData.confirmation.confirmation_url;
  } catch (e) {
    err.textContent = e.message;
    btn.textContent = 'ОПЛАТИТЬ';
    btn.disabled = false;
  }
}

// ============================================================
// УВЕДОМЛЕНИЯ
// ============================================================
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================================
// СТАРТ
// ============================================================
initDemoCart();
</script>
